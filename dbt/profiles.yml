etf_dwh:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DEST_DB_HOST', 'destination_postgres') }}"
      port: "{{ env_var('DEST_DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DEST_DB_NAME', 'destination_db') }}"
      user: "{{ env_var('DEST_DB_USER', 'postgres') }}"
      password: "{{ env_var('DEST_DB_PASSWORD') }}"
      schema: public
      threads: 1
